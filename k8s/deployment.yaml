apiVersion: apps/v1
kind: Deployment
metadata:
  name: asag-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: asag-backend
  template:
    metadata:
      labels:
        app: asag-backend
    spec:
      containers:
        - name: backend
          image: sarangnair/asag-backend:latest
          ports:
            - containerPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: asag-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: asag-frontend
  template:
    metadata:
      labels:
        app: asag-frontend
    spec:
      containers:
        - name: frontend
          image: sarangnair/asag-frontend:latest
          ports:
            - containerPort: 80
