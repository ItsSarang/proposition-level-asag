apiVersion: apps/v1
kind: Deployment
metadata:
  name: asag-backend
  labels:
    app: asag-backend
    tier: api
    course: ccd-cca2
spec:
  replicas: 2
  selector:
    matchLabels:
      app: asag-backend
  template:
    metadata:
      labels:
        app: asag-backend
        tier: api
    spec:
      containers:
        - name: asag-backend
          image: sarangnair/asag-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: PORT
              value: "8000"
            - name: PYTHONUNBUFFERED
              value: "1"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1536Mi"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: asag-frontend
  labels:
    app: asag-frontend
    tier: web
    course: ccd-cca2
spec:
  replicas: 2
  selector:
    matchLabels:
      app: asag-frontend
  template:
    metadata:
      labels:
        app: asag-frontend
        tier: web
    spec:
      containers:
        - name: asag-frontend
          image: sarangnair/asag-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
