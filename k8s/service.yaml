apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    app: asag-backend
    tier: api
    course: ccd-cca2
spec:
  type: ClusterIP
  selector:
    app: asag-backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    app: asag-frontend
    tier: web
    course: ccd-cca2
spec:
  type: NodePort
  selector:
    app: asag-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30080
